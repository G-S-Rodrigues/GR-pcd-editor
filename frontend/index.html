<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GR PCD Editor</title>
    <style>
      :root { color-scheme: dark; --bg:#15181d; --panel:#1d2229; --line:#2f3640; --text:#e4e8ee; --muted:#9aa5b1; --accent:#ff9f1c; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      button, select, input { font: inherit; color: var(--text); background: #2a313b; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
      button { cursor: pointer; }
      button:hover:not(:disabled) { background: #36404c; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.active { outline: 2px solid var(--accent); }
      input[type=text] { width: 7.5em; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
      .row .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
      .row label { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
      #body { flex: 1; display: grid; grid-template-columns: 220px 1fr 280px; min-height: 0; }
      aside { background: var(--panel); padding: 8px; overflow: auto; }
      #tools { border-right: 1px solid var(--line); }
      #inspector { border-left: 1px solid var(--line); }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 0 4px; }
      aside p, aside dl { margin: 4px 0; color: var(--muted); }
      aside dt { float: left; clear: left; width: 6.5em; color: var(--muted); }
      aside dd { margin: 0 0 2px 6.5em; color: var(--text); overflow-wrap: anywhere; }
      #stage { position: relative; min-width: 0; min-height: 0; }
      #viewport { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #legend { position: absolute; right: 10px; top: 8px; display: flex; gap: 10px; font-size: 12px; background: rgba(21,24,29,0.75); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
      #legend .chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
      .headline { font-weight: 600; font-size: 12px; padding: 0 6px; }
      .headline.warn, .note.warn { color: #00d1ff; }
      #axis-legend { position: absolute; left: 14px; bottom: 100px; font-weight: 600; pointer-events: none; }
      #axis-legend span:nth-child(1) { color: #ff5555; } #axis-legend span:nth-child(2) { color: #55ff55; } #axis-legend span:nth-child(3) { color: #5599ff; }
      #empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--muted); pointer-events: none; }
      #webgl-notice { position: absolute; top: 12px; left: 12px; right: 12px; background: #5a1f24; padding: 8px 12px; border-radius: 4px; }
      #notices { position: absolute; top: 8px; right: 8px; width: 340px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
      .notice { padding: 6px 10px; border-radius: 4px; background: #2a313b; border-left: 4px solid #6c7a89; cursor: pointer; }
      .notice.warn { border-color: #e0b341; } .notice.error { border-color: #e63946; }
      #dropzone { position: fixed; inset: 0; background: rgba(255,159,28,.18); border: 3px dashed var(--accent); display: none; place-content: center; font-size: 20px; z-index: 9; pointer-events: none; }
      #dropzone.on { display: grid; }
      #progress { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 6px; display: none; z-index: 4; }
      #progress.on { display: block; }
      #statusbar { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 4px 8px; background: var(--panel); border-top: 1px solid var(--line); }
      #statusbar .item b { color: var(--muted); font-weight: 500; }
      #modebar { padding: 2px 8px; background: #101317; color: var(--muted); }
      dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-width: 420px; max-width: 640px; }
      dialog::backdrop { background: rgba(0,0,0,.55); }
      #mounted-list { list-style: none; margin: 8px 0; padding: 0; max-height: 50vh; overflow: auto; }
      #mounted-list li { padding: 4px 6px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; gap: 12px; }
      #mounted-list li:hover { background: #2a313b; }
      .panel { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 4px; }
      .stack { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
      .triple { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .f { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 2px 0; color: var(--muted); }
      .f input[type=text] { width: 6em; }
      .note { font-size: 12px; }
      .verts { max-height: 160px; overflow: auto; }
      .vertrow { display: grid; grid-template-columns: 1.5em 1fr 1fr; gap: 4px; margin: 2px 0; }
      .vertrow input { width: 100%; }
      #history-list { margin: 4px 0; padding-left: 18px; color: var(--muted); }
      #history-list li.undone { opacity: .5; }
      .badge { padding: 2px 8px; border-radius: 10px; background: #2a313b; color: var(--muted); }
      .badge.on { background: var(--accent); color: #15181d; font-weight: 600; }
      #help { position: absolute; right: 8px; bottom: 8px; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: 6px; display: none; z-index: 4; }
      #help.on { display: block; }
      #help td { padding: 1px 10px 1px 0; }
    </style>
  </head>
  <body data-app="gr-pcd-editor">
    <div id="toolbar" class="row"></div>
    <div id="viewbar" class="row"></div>
    <div id="modebar"></div>
    <div id="body">
      <aside id="tools"></aside>
      <div id="stage">
        <canvas id="viewport"></canvas>
        <div id="axis-legend"><span>X</span> <span>Y</span> <span>Z</span></div>
        <div id="legend"></div>
        <div id="empty">Open a .pcd file to begin.<br />Drop one anywhere, or use “Open from this computer”.</div>
        <div id="progress"></div>
        <div id="webgl-notice" hidden></div>
        <div id="notices"></div>
        <div id="help"></div>
      </div>
      <aside id="inspector"><div id="fileinfo"></div><div id="editpanels"></div></aside>
    </div>
    <div id="statusbar"></div>
    <div id="dropzone">Drop a .pcd or .pcdsession file to open it</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
